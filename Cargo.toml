[package]
name = "magictoys"
version = "0.0.4"
authors = ["Antigravity"]
edition = "2021"
description = "MagicToys — Native Clipboard, Emoji, and OCR tools for Linux"
license = "GPL-3.0-or-later"

[dependencies]
# UI Framework
slint = { version = "1.9", features = ["compat-1-2"] }
i-slint-backend-winit = "1.9"

# Clipboard Integration
arboard = { version = "3.4", features = ["image-data", "wayland-data-control"] }

# SQLite database (bundled pure C/Rust SQLite to avoid system sqlite3 version mismatch)
rusqlite = { version = "0.32", features = ["bundled"] }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Image processing for screenshot clips and OCR preprocessing
image = "0.25"
png = "0.17"
base64 = "0.22"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "5.0"
once_cell = "1.19"
parking_lot = "0.12"
percent-encoding = "2.3"

# Low-level system integrations
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xtest", "xfixes"] }
libc = "0.2"

# Emojis database helper
emojis = "0.6"

# DBus integration and Portal client (pure async-io executor to prevent Tokio reactor conflict on Slint main loop)
ksni = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }

[build-dependencies]
slint-build = "1.9"

[[bin]]
name = "magictoys"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
